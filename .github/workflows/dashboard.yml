name: Dashboard

# The cloud dashboard (apps/dashboard): one Cloudflare Worker serving a React
# SPA and reading an R2 bucket. Every change is linted, typechecked, tested and
# built; a push to main also deploys it, once the Cloudflare secrets exist.
# Setup: docs/cloud-dashboard.md.

on:
  pull_request:
    paths:
      - apps/dashboard/**
      - .github/workflows/dashboard.yml
  push:
    branches: [main]
    paths:
      - apps/dashboard/**
      - .github/workflows/dashboard.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm's version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/dashboard/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Worker types are up to date with wrangler.jsonc
        run: pnpm cf-typegen:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The Cloudflare secrets are ENVIRONMENT secrets of "production", whose
    # deployment-branch rule admits main only (and may require a reviewer), so
    # GitHub itself refuses them to a workflow run from any other branch; the
    # `if:` above is not the only lock. Create the environment before the first
    # deploy (docs/cloud-dashboard.md, step 9): GitHub would otherwise create
    # it on first use with no rules.
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time, and never cancel one half way.
    concurrency:
      group: dashboard-deploy
      cancel-in-progress: false
    steps:
      # Secrets cannot appear in `if:`, so their presence is read here first.
      # Without them every later step is skipped and the job still passes: a
      # fork, or this repo before Cloudflare is set up, stays green.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set in the production environment. See docs/cloud-dashboard.md."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.creds.outputs.ready == 'true'
        with:
          package_json_file: apps/dashboard/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      # The Cloudflare Vite plugin writes the deployable Worker + assets to
      # dist/ and points `wrangler deploy` at them, so build first.
      - name: Install and build
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # ACCESS_TEAM_DOMAIN / ACCESS_AUD are Worker secrets set once on the
      # Worker itself; a deploy keeps them. Until they are set the Worker
      # refuses every /api and /media request.
      #
      # wrangler from the lockfile, run directly: no third-party action holds
      # the token. Logs of a public repository are public, so wrangler prints
      # warnings and errors only (WRANGLER_LOG=warn). On an authentication
      # error it otherwise runs `whoami`, which prints the email of the
      # token's user and a table of every account name and id the token can
      # see; GitHub masks secrets, not those. The error itself still prints.
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: warn
          WRANGLER_WRITE_LOGS: "false"
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy
