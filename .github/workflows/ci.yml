name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here needs more than read access, and no job receives a secret: the
# test suite runs with dummy broker keys (tests/conftest.py) and no network
# services, exactly like a fresh clone.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # matches the production venv (3.12.13)
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt

      # `publish` brings boto3 at the versions requirements/constraints.txt
      # pins, so the publisher's real-client tests (tests/test_publish_pins.py)
      # run against exactly what the home box installs.
      - name: Install (pinned to the production venv's versions)
        run: |
          python -m pip install -U pip
          python -m pip install -c requirements/constraints.txt -e ".[dev,backtest,ibkr,publish]"

      - name: Lint the trading path
        # relay / sigengine / agent / web are the order path and its viewers;
        # briefing/ and backtest/ carry known lint debt and are not gated yet.
        run: ruff check relay sigengine agent web

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the tip
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan full history
        run: ./gitleaks git . --redact --verbose --exit-code 1
