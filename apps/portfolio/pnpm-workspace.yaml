# Pre-approve the build scripts this package's dev dependencies need:
# `workerd` (pulled in by wrangler, for `wrangler dev`) downloads the platform
# binary and `esbuild` downloads/builds native bindings. Without these, pnpm
# 11+ aborts the install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true
