# IBC 3.24.0 config — controls the headless IB Gateway (paper by default).
# Validated against ~/IBC/config.ini (the IBC 3.24.0 sample): every key here is
# a real IBC setting. The previous version of this file used keys that don't
# exist in IBC 3.24.0 (ApiOnly, HideUi, ApiClientId, MasterClientFreezeOrderActions,
# IbLoginType, SecondInstanceDetectedAction, MinUiWithWindowSize, SshTerminalWindowLines,
# LogToConsole, LogComponents, LogLevel, PreferIpv4, SaveTwsSettingsAtExit, FixUserId,
# FixPassword) and were silently ignored.
#
# Credentials are NOT read from here: run_ibgateway.sh exports TWSUSERID /
# TWSPASSWORD (mapped from .env's TWS_USERID / TWS_PASSWORD) and gatewaystart.sh
# passes them to ibcstart.sh as --user / --pw, which override IbLoginId/IbPassword.
# So leave those blank. Never put the password in this file.
#
# Place at ~/.config/ibc/ibc.ini (or point run_ibgateway.sh at this file via
# IBC_INI). Install IBC: https://github.com/IbcAlpha/IBC
# Install IB Gateway (paper): https://www.interactivebrokers.com → Downloads.
# Then:  ./deploy/run_ibgateway.sh

# We use the IB API gateway (not FIX CTCI).
FIX=no

# Blank — supplied via --user / --pw on the ibcstart command line
# (gatewaystart.sh reads TWSUSERID/TWSPASSWORD env vars and forwards them).
IbLoginId=
IbPassword=
FIXLoginId=
FIXPassword=

# Where the Gateway stores its settings. IB Gateway installs to ~/Jts/ibgateway.
IbDir=~/Jts/ibgateway

# Both launchers (run_ibgateway.sh, restart_gateway.sh) ALWAYS pass the mode
# on IBC's command line as --mode=$IBKR_TRADING_MODE (default "paper"), and the
# command line overrides this line. Set IBKR_TRADING_MODE in .env, not here.
# This line only takes effect if IBC is started some other way, so it holds the
# safe value, paper.
#
# When to use "live": with live-account credentials in TWS_USERID/TWS_PASSWORD,
# "paper" fails with "user has multiple Paper Trading users associated with
# it" if that live account has more than one linked paper account (IBKR cannot
# pick one), so IBKR_TRADING_MODE=live is needed unless you log in with a
# specific paper-trading username. Either way this connection stays DATA-ONLY:
# ReadOnlyApi below is the real safety boundary, not this setting.
TradingMode=paper

# Paper login shows a "this is not a brokerage account" warning that blocks API
# connections until dismissed. Auto-accept it so headless API connects work.
AcceptNonBrokerageAccountWarning=yes

# Store settings locally, not on IB servers (paper account, keep it simple).
StoreSettingsOnServer=no

# Minimize the main window (it lives on the xvfb virtual display anyway).
MinimizeMainWindow=yes

# If another session is already running, take over as primary.
ExistingSessionDetectedAction=primary

# The signal engine connects on 4002 — force the Gateway's API socket to it.
OverrideTwsApiPort=4002

ReadOnlyLogin=no
# IBKR is DATA-ONLY here (orders go to Alpaca, never IBKR). Read-only API is a
# safety belt: it blocks order submit/modify/cancel via the IB API while still
# allowing historical + live market data. TESTED 2026-07-06 (temporarily set
# to 'no' to check whether it was contributing to qualifyContracts hanging) —
# RULED OUT: a hang recurred within 20s of the fresh restart under
# ReadOnlyApi=no, and again ~4min later blocking all other symbols, the exact
# same failure pattern as under 'yes'. Reverted — this setting has no bearing
# on the hang and there's no reason to keep the safety belt disabled.
ReadOnlyApi=yes

# What IBC does with the Gateway's "Incoming connection" dialog, which appears
# only for an API client whose IP is NOT trusted. The signal engine connects
# from 127.0.0.1, which the Gateway always permits, so it never sees this
# dialog. "accept" would let any other address that can reach the API port
# connect without anyone clicking; "reject" turns all of them away, which is
# what IBC's own sample recommends. Also turn on "Allow connections from
# localhost only" in the Gateway's API settings (Configure > Settings > API >
# Settings), so the port refuses other addresses before any dialog.
AcceptIncomingConnectionAction=reject

# Ignored here: IBC reads this only when FIX=yes (the FIX gateway), and FIX=no
# above. It is not what keeps the API on localhost; the Gateway setting named
# above is. Left blank because 127.0.0.1 is always permitted and IBC's sample
# says not to list it.
TrustedTwsApiClientIPs=

# SECURITY-PRESERVING 2FA schedule (no TOTP secret is ever stored on disk —
# your phone authenticator remains the real second factor):
#   AutoRestartTime — daily WARM restart. Reuses the current session's
#     credentials, so it needs NO re-authentication at all. This is what
#     satisfies IBKR's requirement that Gateway be restarted periodically,
#     with zero manual intervention. Any time of day works — it's a brief
#     reconnect blip and the engine already falls back to yfinance
#     automatically during any IBKR gap (sigengine/engine.py _fetch_bars).
#   ColdRestartTime — Sundays ONLY. A full logout/login cycle, which DOES
#     require 2FA — this is an unavoidable IBKR platform requirement (all
#     security tokens are invalidated every Sunday ~01:00 US/Eastern,
#     regardless of tooling), not something any automation can remove
#     without storing a bypass secret. Set this to a Sunday time (LOCAL
#     timezone, 24h HH:MM, comfortably after 01:00 US/Eastern accounting for
#     DST drift) when you're actually around to tap "approve" on your phone —
#     that is the ONLY manual step in this entire setup, once a week, on your
#     schedule. If you're not there when it fires, TWOFA_TIMEOUT_ACTION=exit
#     (below, in run_ibgateway.sh) makes IBC exit cleanly rather than hang —
#     the engine keeps running on the yfinance fallback until you next start
#     the Gateway and tap approve, whenever that is.
AutoRestartTime=03:00 AM
# ColdRestartTime=18:00 below is a placeholder (Sunday 6pm local) chosen to
# clear 01:00 US/Eastern with margin for AEST/AEDT vs EST/EDT's ~14-16h
# offset swing across the year (Australia's and the US's DST calendars run
# opposite halves of the year). VERIFY this against your current UTC offset
# before relying on it — if it's set too early, the cold restart could fire
# before IBKR has actually invalidated the old tokens, which may or may not
# force a real 2FA prompt depending on IBKR's exact behavior that week.
ColdRestartTime=18:00
AutoLogoffTime=
ClosedownAt=

# Dismiss noisy dialogs so they don't block headless operation.
DismissPasswordExpiryWarning=yes
DismissNSEComplianceNotice=yes

# Disable IBC's command server (we don't script IBC over its own port).
CommandServerPort=0

# Crypto currency order confirmation — doesn't affect us (crypto trades on
# Alpaca; IBKR is equity data only here). Leave default.
ConfirmCryptoCurrencyOrders=manual

AllowBlindTrading=no
ResetOrderIdsAtStart=
ConfirmOrderIdReset=
SaveTwsSettingsAt=